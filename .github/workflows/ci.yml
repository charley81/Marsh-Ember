name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONTENT_SOURCE: fixtures
      NEXT_PUBLIC_SANITY_PROJECT_ID: test0000
      NEXT_PUBLIC_SANITY_DATASET: production
      SANITY_API_READ_TOKEN: sanity-read-token-for-ci
      SANITY_STUDIO_PROJECT_ID: test0000
      SANITY_STUDIO_DATASET: production
      SANITY_STUDIO_PREVIEW_ORIGIN: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', '*.ts', '*.tsx', '*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Run project checks
        run: pnpm check

      - name: Verify generated Sanity artifacts are current
        run: git diff --exit-code -- studio/schema.json sanity/types.generated.ts

      - name: Run browser smoke tests
        run: pnpm test:e2e:run

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
